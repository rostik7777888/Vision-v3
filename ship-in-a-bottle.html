<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Voxel Voyager · a ship in a bottle</title>
<style>
:root{--ink:#f4e7c9;--dim:rgba(244,231,201,.62);--card:rgba(14,20,30,.58);--line:rgba(244,231,201,.16);--gold:#e8b960}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#06080c;color:var(--ink);font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#title{position:fixed;left:26px;top:20px;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#title h1{margin:0;font-weight:400;font-style:italic;font-size:30px;letter-spacing:.05em}
#title p{margin:5px 0 0;font-size:11.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim)}
#panel{position:fixed;left:18px;bottom:18px;width:322px;padding:12px 16px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 12px 40px rgba(0,0,0,.45);font-size:13px;transition:transform .35s ease}
#panel.hidden{transform:translateY(calc(100% - 38px))}
#panel header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
#panel header button{all:unset;cursor:pointer;color:var(--dim);font-size:18px;line-height:1;padding:0 4px}
.row{display:grid;grid-template-columns:62px 1fr 56px;align-items:center;gap:8px;margin:7px 0}
.row label{color:var(--dim)}
.row output{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:linear-gradient(90deg,#2b5876,#e8b960);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#f4e7c9;border:2px solid #1b2433;cursor:pointer;box-shadow:0 0 0 2px rgba(232,185,96,.35)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#f4e7c9;border:2px solid #1b2433;cursor:pointer}
.toggles{display:flex;gap:16px;margin:4px 0 2px;color:var(--dim)}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.btns button{cursor:pointer;font:inherit;font-size:12.5px;color:var(--ink);background:rgba(244,231,201,.07);border:1px solid var(--line);border-radius:9px;padding:7px 6px;transition:background .2s,border-color .2s}
.btns button:hover{background:rgba(232,185,96,.18);border-color:rgba(232,185,96,.5)}
.hint{margin-top:10px;font-size:11.5px;line-height:1.55;color:var(--dim)}
.hint b{color:var(--ink);font-weight:400}
#fps{position:fixed;right:14px;top:12px;font:11px ui-monospace,Menlo,monospace;color:var(--dim);display:none;pointer-events:none}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#06080c;z-index:10;transition:opacity .9s}
#loading .t{font-style:italic;font-size:22px;letter-spacing:.06em}
#loading .s{margin-top:8px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
#err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;padding:40px;background:#06080c;z-index:20}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="title"><h1>The Voxel Voyager</h1><p>a ship in a bottle</p></div>
<div id="panel">
  <header><span>Captain's console</span><button id="hide" title="Hide panel (H)">–</button></header>
  <div class="row"><label for="tod">Time</label><input id="tod" type="range" min="0" max="24" step="0.05" value="16.4"><output id="todv">16:24</output></div>
  <div class="row"><label for="wx">Weather</label><input id="wx" type="range" min="0" max="1" step="0.01" value="0.22"><output id="wxv">Fair</output></div>
  <div class="toggles"><label><input id="autoT" type="checkbox" checked> run time</label><label><input id="autoO" type="checkbox" checked> orbit camera</label></div>
  <div class="btns">
    <button id="bFire">💥 Fire broadside</button>
    <button id="bRock">🍾 Rock the bottle</button>
    <button id="bToss">🛢️ Toss flotsam</button>
    <button id="bNight">🌗 Day / night</button>
  </div>
  <div class="hint"><b>Drag</b> orbit · <b>Scroll</b> zoom · <b>Right-drag</b> / <b>Shift-drag</b> tilt the bottle · <b>Click</b> the sea to drop a gem · <b>Space</b> fire · <b>R</b> rock · <b>H</b> hide</div>
</div>
<div id="fps"></div>
<div id="loading"><div class="t">Building the voyage…</div><div class="s">voxel by voxel</div></div>
<div id="err"></div>
<script>
  setTimeout(function () {
    if (!window.__vvStarted) {
      var e = document.getElementById('err'); e.style.display = 'flex';
      e.innerHTML = '<div><h2 style="font-weight:400;font-style:italic">The bottle would not open…</h2><p style="opacity:.7">three.js could not be loaded from cdn.jsdelivr.net. Check your internet connection and reload the page.</p></div>';
    }
  }, 25000);
</script>
